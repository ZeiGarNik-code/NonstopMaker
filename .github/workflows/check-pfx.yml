# Diagnostic: kiểm tra PFX (code-signing certificate) trong GitHub Secrets.
#
# AN TOÀN:
# - KHÔNG bao giờ in ra giá trị secret, mật khẩu, hay private key.
# - Chỉ báo: secret có tồn tại (PRESENT/MISSING) hay không, file PFX có
#   giải mã base64 / parse PKCS#12 được không, và thông tin CÔNG KHAI của
#   chứng chỉ (subject, issuer, hạn dùng, fingerprint) — thông tin này vốn
#   đã công khai trên mọi file đã ký.
# - File PFX tạm bị xóa ngay sau khi kiểm tra.
# - Kết quả tóm tắt đồng thời được post lên Commit Status API (contexts
#   `pfx/...`) để đọc được qua api.github.com mà không cần tải log.
#
# Cách dùng sau khi merge vào `main`:
#   Actions tab -> "Check PFX Secret" -> Run workflow
# Nếu bạn đã lưu secret với tên khác ngoài danh sách ứng viên bên dưới,
# hãy thêm tên đó vào cả khối `env:` lẫn mảng trong step kiểm tra.
# Re-run trigger: 2026-10-31 - kiem tra lai sau khi cap nhat WINDOWS_CERTIFICATE (PFX tu ky moi tao).

name: Check PFX Secret

on:
  workflow_dispatch:
  push:
    branches: ["arena/dd346b94-nonstopmaker"]
    paths: [".github/workflows/check-pfx.yml"]

permissions:
  contents: read
  statuses: write

jobs:
  check-pfx:
    runs-on: ubuntu-latest
    # Ánh xạ các tên secret ứng viên thường dùng cho PFX.
    # Secret không tồn tại sẽ là chuỗi rỗng -> báo MISSING.
    env:
      GH_TOKEN: ${{ github.token }}
      # --- Ứng viên chứa chứng chỉ (thường là base64 của file .pfx/.p12) ---
      PFX: ${{ secrets.PFX }}
      PFX_BASE64: ${{ secrets.PFX_BASE64 }}
      PFX_CONTENT: ${{ secrets.PFX_CONTENT }}
      PFX_CERTIFICATE: ${{ secrets.PFX_CERTIFICATE }}
      PFX_FILE: ${{ secrets.PFX_FILE }}
      CERT_PFX: ${{ secrets.CERT_PFX }}
      CERTIFICATE_PFX: ${{ secrets.CERTIFICATE_PFX }}
      CERTIFICATE: ${{ secrets.CERTIFICATE }}
      CERT: ${{ secrets.CERT }}
      CERT_BASE64: ${{ secrets.CERT_BASE64 }}
      BASE64_ENCODED_PFX: ${{ secrets.BASE64_ENCODED_PFX }}
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      WINDOWS_PFX: ${{ secrets.WINDOWS_PFX }}
      SIGNING_CERTIFICATE: ${{ secrets.SIGNING_CERTIFICATE }}
      SIGNING_PFX: ${{ secrets.SIGNING_PFX }}
      CODE_SIGNING_CERTIFICATE: ${{ secrets.CODE_SIGNING_CERTIFICATE }}
      CODE_SIGNING_PFX: ${{ secrets.CODE_SIGNING_PFX }}
      SIGN_CERT: ${{ secrets.SIGN_CERT }}
      WINDOWS_CSC_PFX_BASE64: ${{ secrets.WINDOWS_CSC_PFX_BASE64 }}
      # --- Ứng viên chứa mật khẩu PFX (chỉ báo tồn tại, không in độ dài) ---
      PFX_PASSWORD: ${{ secrets.PFX_PASSWORD }}
      PFX_PASS: ${{ secrets.PFX_PASS }}
      CERT_PASSWORD: ${{ secrets.CERT_PASSWORD }}
      CERT_PASS: ${{ secrets.CERT_PASS }}
      CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
      SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.SIGNING_CERTIFICATE_PASSWORD }}
      SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      WINDOWS_CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
    steps:
      - name: Check which PFX secrets exist (values never printed)
        shell: bash
        run: |
          set +x
          post_status() {
            local ctx="$1" state="$2" desc="$3"
            desc=$(printf '%s' "$desc" | tr '\n' ' ' | cut -c1-140)
            if command -v gh >/dev/null 2>&1; then
              gh api "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
                -f state="$state" -f context="$ctx" -f description="$desc" \
                -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
                >/dev/null 2>&1 || echo "WARN: post_status failed: $ctx"
            fi
          }

          CERT_NAMES=(PFX PFX_BASE64 PFX_CONTENT PFX_CERTIFICATE PFX_FILE CERT_PFX CERTIFICATE_PFX CERTIFICATE CERT CERT_BASE64 BASE64_ENCODED_PFX WINDOWS_CERTIFICATE WINDOWS_PFX SIGNING_CERTIFICATE SIGNING_PFX CODE_SIGNING_CERTIFICATE CODE_SIGNING_PFX SIGN_CERT WINDOWS_CSC_PFX_BASE64)
          PASS_NAMES=(PFX_PASSWORD PFX_PASS CERT_PASSWORD CERT_PASS CERTIFICATE_PASSWORD SIGNING_CERTIFICATE_PASSWORD SIGNING_PASSWORD WINDOWS_CERTIFICATE_PASSWORD WINDOWS_CSC_KEY_PASSWORD)

          {
            echo "## 🔐 Kết quả kiểm tra PFX Secret"
            echo ""
            echo "### Secret chứng chỉ (PFX)"
            echo "| Secret | Trạng thái |"
            echo "|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"

          FOUND_CERT=""
          PRESENT_CERTS=""
          for n in "${CERT_NAMES[@]}"; do
            if [ -n "${!n:-}" ]; then
              echo "✅ $n : PRESENT"
              echo "| \`$n\` | ✅ PRESENT |" >> "$GITHUB_STEP_SUMMARY"
              [ -z "$FOUND_CERT" ] && FOUND_CERT="$n"
              PRESENT_CERTS="${PRESENT_CERTS:+$PRESENT_CERTS,}$n"
            else
              echo "❌ $n : MISSING (không tồn tại hoặc rỗng)"
              echo "| \`$n\` | ❌ MISSING |" >> "$GITHUB_STEP_SUMMARY"
            fi
          done

          {
            echo ""
            echo "### Secret mật khẩu PFX"
            echo "| Secret | Trạng thái |"
            echo "|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"

          FOUND_PASS=""
          PRESENT_PASSES=""
          for n in "${PASS_NAMES[@]}"; do
            if [ -n "${!n:-}" ]; then
              echo "✅ $n : PRESENT"
              echo "| \`$n\` | ✅ PRESENT |" >> "$GITHUB_STEP_SUMMARY"
              [ -z "$FOUND_PASS" ] && FOUND_PASS="$n"
              PRESENT_PASSES="${PRESENT_PASSES:+$PRESENT_PASSES,}$n"
            else
              echo "❌ $n : MISSING (không tồn tại hoặc rỗng)"
              echo "| \`$n\` | ❌ MISSING |" >> "$GITHUB_STEP_SUMMARY"
            fi
          done

          echo "FOUND_CERT=$FOUND_CERT" >> "$GITHUB_ENV"
          echo "FOUND_PASS=$FOUND_PASS" >> "$GITHUB_ENV"

          if [ -n "$PRESENT_CERTS" ]; then
            post_status "pfx/cert-present" "success" "cert_present=$PRESENT_CERTS"
          else
            post_status "pfx/cert-present" "failure" "cert_present=NONE"
          fi
          if [ -n "$PRESENT_PASSES" ]; then
            post_status "pfx/pass-present" "success" "pass_present=$PRESENT_PASSES"
          else
            post_status "pfx/pass-present" "failure" "pass_present=NONE"
          fi

          # Cap secret rieng cua workflow build Windows (build-windows-app.yml)
          if [ -n "${WINDOWS_CSC_PFX_BASE64:-}" ]; then
            echo "CSC_PRESENT=yes" >> "$GITHUB_ENV"
            post_status "csc/cert-present" "success" "csc_cert_present=WINDOWS_CSC_PFX_BASE64"
          else
            echo "CSC_PRESENT=no" >> "$GITHUB_ENV"
            post_status "csc/cert-present" "failure" "csc_cert_present=NONE"
          fi
          if [ -n "${WINDOWS_CSC_KEY_PASSWORD:-}" ]; then
            post_status "csc/pass-present" "success" "csc_pass_present=WINDOWS_CSC_KEY_PASSWORD"
          else
            post_status "csc/pass-present" "failure" "csc_pass_present=NONE"
          fi

      - name: Validate PFX file (base64 + PKCS#12 parse, public info only)
        if: env.FOUND_CERT != ''
        shell: bash
        run: |
          set +x
          post_status() {
            local ctx="$1" state="$2" desc="$3"
            desc=$(printf '%s' "$desc" | tr '\n' ' ' | cut -c1-140)
            if command -v gh >/dev/null 2>&1; then
              gh api "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
                -f state="$state" -f context="$ctx" -f description="$desc" \
                -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
                >/dev/null 2>&1 || echo "WARN: post_status failed: $ctx"
            fi
          }

          echo "Dùng secret chứng chỉ: $FOUND_CERT"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Kiểm tra file PFX trong \`$FOUND_CERT\`" >> "$GITHUB_STEP_SUMMARY"

          CERT_VALUE="${!FOUND_CERT}"
          export PFX_PASS_TMP=""
          if [ -n "${FOUND_PASS:-}" ]; then
            PFX_PASS_TMP="${!FOUND_PASS}"
            export PFX_PASS_TMP
            echo "Dùng secret mật khẩu: $FOUND_PASS"
          else
            echo "Không tìm thấy secret mật khẩu - sẽ thử mật khẩu rỗng"
          fi

          # 1) Giải mã base64 (GitHub Secret là text nên PFX phải được base64 hóa)
          #    Thử lần lượt: chuẩn -> thêm padding -> URL-safe -> trích PEM -> hex.
          #    Chỉ báo thống kê định dạng, KHÔNG in nội dung secret.
          STRIPPED=$(printf '%s' "$CERT_VALUE" | tr -d '[:space:]')
          RAW_LEN=${#CERT_VALUE}
          STRIPPED_LEN=${#STRIPPED}
          MOD4=$((STRIPPED_LEN % 4))
          INVALID_COUNT=$(printf '%s' "$STRIPPED" | tr -d 'A-Za-z0-9+/=' | wc -c | tr -d ' ')
          HAS_URLSAFE=no; case "$STRIPPED" in *-*|*_*) HAS_URLSAFE=yes;; esac
          HAS_PEM=no; case "$CERT_VALUE" in *"-----BEGIN"*) HAS_PEM=yes;; esac
          STARTS_MII=no; case "$STRIPPED" in MII*) STARTS_MII=yes;; esac
          PURE_HEX=no
          if printf '%s' "$STRIPPED" | grep -qE '^[0-9A-Fa-f]+$' && [ $((STRIPPED_LEN % 2)) -eq 0 ]; then PURE_HEX=yes; fi
          post_status "pfx/secret-format" "success" "raw_len=$RAW_LEN stripped_len=$STRIPPED_LEN mod4=$MOD4 invalid_b64_chars=$INVALID_COUNT"
          post_status "pfx/secret-flags" "success" "urlsafe_chars=$HAS_URLSAFE pem_header=$HAS_PEM starts_MII=$STARTS_MII pure_hex=$PURE_HEX"

          decoded=0; decoded_via=""
          if printf '%s' "$STRIPPED" | base64 -d > /tmp/cert.pfx 2>/dev/null; then
            decoded=1; decoded_via="standard"
          fi
          if [ "$decoded" = "0" ] && [ "$MOD4" != "0" ]; then
            PADDED="$STRIPPED"; while [ $(( ${#PADDED} % 4 )) -ne 0 ]; do PADDED="${PADDED}="; done
            if printf '%s' "$PADDED" | base64 -d > /tmp/cert.pfx 2>/dev/null; then decoded=1; decoded_via="added_padding"; fi
            unset PADDED
          fi
          if [ "$decoded" = "0" ] && [ "$HAS_URLSAFE" = "yes" ]; then
            CONVERTED=$(printf '%s' "$STRIPPED" | tr -- '-_' '+/')
            while [ $(( ${#CONVERTED} % 4 )) -ne 0 ]; do CONVERTED="${CONVERTED}="; done
            if printf '%s' "$CONVERTED" | base64 -d > /tmp/cert.pfx 2>/dev/null; then decoded=1; decoded_via="urlsafe"; fi
            unset CONVERTED
          fi
          if [ "$decoded" = "0" ] && [ "$HAS_PEM" = "yes" ]; then
            if printf '%s' "$CERT_VALUE" | sed -n '/-----BEGIN/,/-----END/p' | grep -v -- '-----' | tr -d '[:space:]' | base64 -d > /tmp/cert.pfx 2>/dev/null; then
              decoded=1; decoded_via="pem_body"
            fi
          fi
          if [ "$decoded" = "0" ] && [ "$PURE_HEX" = "yes" ]; then
            if printf '%s' "$STRIPPED" | python3 -c 'import sys,binascii; sys.stdout.buffer.write(binascii.unhexlify(sys.stdin.read().strip()))' > /tmp/cert.pfx 2>/dev/null; then
              decoded=1; decoded_via="hex"
            fi
          fi
          unset STRIPPED

          if [ "$decoded" != "1" ]; then
            echo "❌ Secret KHÔNG giải mã được bằng base64 (chuẩn/padding/URL-safe/PEM) hay hex"
            echo "- ❌ Base64: **không hợp lệ** (raw_len=$RAW_LEN, mod4=$MOD4, invalid_chars=$INVALID_COUNT, pem=$HAS_PEM, starts_MII=$STARTS_MII)" >> "$GITHUB_STEP_SUMMARY"
            echo "- Cách sửa: mã hóa lại file .pfx thật bằng base64 rồi lưu lại secret, VD PowerShell: \`[Convert]::ToBase64String([IO.File]::ReadAllBytes('cert.pfx'))\` hoặc Linux/macOS: \`base64 -w0 cert.pfx\`" >> "$GITHUB_STEP_SUMMARY"
            post_status "pfx/base64" "failure" "base64=INVALID found_cert=$FOUND_CERT decoded_via=NONE"
            rm -f /tmp/cert.pfx
            exit 0
          fi
          SIZE=$(wc -c < /tmp/cert.pfx | tr -d ' ')
          echo "✅ Giải mã được (via=$decoded_via), kích thước file: ${SIZE} byte"
          echo "- ✅ Giải mã: thành công qua \`$decoded_via\` (${SIZE} byte)" >> "$GITHUB_STEP_SUMMARY"
          post_status "pfx/base64" "success" "decode=OK via=$decoded_via size_bytes=$SIZE pass_source=${FOUND_PASS:-EMPTY_PASSWORD}"

          # Phân loại nhanh: file sau giải mã có thể là DER/PEM cert đơn lẻ chứ không phải PFX
          if openssl x509 -inform DER -in /tmp/cert.pfx -noout -subject > /tmp/type.txt 2>/dev/null || openssl x509 -inform PEM -in /tmp/cert.pfx -noout -subject > /tmp/type.txt 2>/dev/null; then
            TYPE_SUBJECT=$(cat /tmp/type.txt 2>/dev/null || true)
            echo "⚠️ File sau giải mã là chứng chỉ X.509 đơn lẻ, KHÔNG phải PFX/PKCS#12: $TYPE_SUBJECT"
            echo "- ⚠️ Loại file: **X.509 đơn lẻ, không phải PFX** ($TYPE_SUBJECT)" >> "$GITHUB_STEP_SUMMARY"
            post_status "pfx/decoded-type" "failure" "type=X509_CERT_ONLY_NOT_PFX $TYPE_SUBJECT"
          else
            post_status "pfx/decoded-type" "success" "type=NOT_PLAIN_X509 (se tiep tuc thu PKCS12)"
          fi

          # 2) Parse PKCS#12 (thử cả chế độ -legacy cho cert thuật toán cũ)
          parse_ok=0
          for opts in "" "-legacy"; do
            if openssl pkcs12 $opts -in /tmp/cert.pfx -nokeys -clcerts \
                 -passin env:PFX_PASS_TMP -out /tmp/cert.pem 2>/tmp/pkcs.err; then
              parse_ok=1; break
            fi
          done
          if [ "$parse_ok" != "1" ]; then
            echo "❌ Không mở được PKCS#12: sai mật khẩu, hoặc file không phải .pfx/.p12 hợp lệ"
            echo "- ❌ PKCS#12: **mở thất bại** (sai mật khẩu hoặc file hỏng/không phải PFX)" >> "$GITHUB_STEP_SUMMARY"
            post_status "pfx/pkcs12" "failure" "pkcs12=FAIL wrong_password_or_not_a_pfx_file"
            rm -f /tmp/cert.pfx /tmp/cert.pem
            exit 0
          fi
          echo "✅ Mở PKCS#12 thành công (mật khẩu đúng)"
          echo "- ✅ PKCS#12: mở thành công, mật khẩu đúng" >> "$GITHUB_STEP_SUMMARY"
          post_status "pfx/pkcs12" "success" "pkcs12=OK password_correct"

          # 3) Có private key đi kèm không? (chỉ đếm, KHÔNG in key)
          KEY_COUNT=0
          for opts in "" "-legacy"; do
            KEY_COUNT=$(openssl pkcs12 $opts -in /tmp/cert.pfx -nocerts -nodes \
              -passin env:PFX_PASS_TMP 2>/dev/null | grep -c "PRIVATE KEY" || true)
            [ "${KEY_COUNT:-0}" -gt 0 ] && break
          done
          if [ "${KEY_COUNT:-0}" -gt 0 ]; then
            echo "✅ Có private key trong PFX (dùng để ký được)"
            echo "- ✅ Private key: có (ký được)" >> "$GITHUB_STEP_SUMMARY"
            post_status "pfx/private-key" "success" "private_key=PRESENT can_sign=yes"
          else
            echo "⚠️ PFX chỉ chứa chứng chỉ, KHÔNG có private key -> không ký được"
            echo "- ⚠️ Private key: **không có** (không ký được)" >> "$GITHUB_STEP_SUMMARY"
            post_status "pfx/private-key" "failure" "private_key=MISSING can_sign=no"
          fi

          # 4) Thông tin công khai + hạn dùng
          echo "----- Thông tin chứng chỉ (công khai) -----"
          openssl x509 -in /tmp/cert.pem -noout -subject -issuer -dates -serial -fingerprint -sha256 | tee /tmp/cert.info
          {
            echo '```'
            cat /tmp/cert.info
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          SUBJECT=$(openssl x509 -in /tmp/cert.pem -noout -subject 2>/dev/null || true)
          ISSUER=$(openssl x509 -in /tmp/cert.pem -noout -issuer 2>/dev/null || true)
          DATES=$(openssl x509 -in /tmp/cert.pem -noout -dates 2>/dev/null | tr '\n' ' ' || true)
          SERIAL=$(openssl x509 -in /tmp/cert.pem -noout -serial 2>/dev/null || true)
          FPR=$(openssl x509 -in /tmp/cert.pem -noout -fingerprint -sha256 2>/dev/null || true)
          post_status "pfx/cert-subject" "success" "$SUBJECT"
          post_status "pfx/cert-issuer" "success" "$ISSUER"
          post_status "pfx/cert-dates" "success" "$DATES"
          post_status "pfx/cert-serial" "success" "$SERIAL"
          post_status "pfx/cert-fingerprint" "success" "$FPR"

          ENDDATE=$(openssl x509 -in /tmp/cert.pem -noout -enddate 2>/dev/null | cut -d= -f2- || true)
          DAYS_LEFT="unknown"
          if [ -n "$ENDDATE" ]; then
            END_EPOCH=$(date -d "$ENDDATE" +%s 2>/dev/null || echo "")
            if [ -n "$END_EPOCH" ]; then
              DAYS_LEFT=$(( (END_EPOCH - $(date +%s)) / 86400 ))
            fi
          fi
          if openssl x509 -in /tmp/cert.pem -noout -checkend 0 >/dev/null; then
            echo "✅ Chứng chỉ CÒN hạn (còn ~${DAYS_LEFT} ngày)"
            echo "- ✅ Hiệu lực: **còn hạn** (~${DAYS_LEFT} ngày)" >> "$GITHUB_STEP_SUMMARY"
            post_status "pfx/expiry" "success" "expiry=STILL_VALID days_left=$DAYS_LEFT end=$ENDDATE"
          else
            echo "❌ Chứng chỉ ĐÃ HẾT HẠN (${DAYS_LEFT} ngày)"
            echo "- ❌ Hiệu lực: **ĐÃ HẾT HẠN**" >> "$GITHUB_STEP_SUMMARY"
            post_status "pfx/expiry" "failure" "expiry=EXPIRED days_left=$DAYS_LEFT end=$ENDDATE"
          fi

          # 5) Dọn dẹp ngay
          rm -f /tmp/cert.pfx /tmp/cert.pem /tmp/cert.info /tmp/b64.err /tmp/pkcs.err
          unset PFX_PASS_TMP CERT_VALUE

      - name: Validate WINDOWS_CSC pair (used by build-windows-app.yml)
        if: env.CSC_PRESENT == 'yes'
        shell: bash
        run: |
          set +x
          post_status() {
            local ctx="$1" state="$2" desc="$3"
            desc=$(printf '%s' "$desc" | tr '\n' ' ' | cut -c1-140)
            if command -v gh >/dev/null 2>&1; then
              gh api "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
                -f state="$state" -f context="$ctx" -f description="$desc" \
                -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
                >/dev/null 2>&1 || echo "WARN: post_status failed: $ctx"
            fi
          }

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Kiểm tra cặp CSC của workflow build Windows" >> "$GITHUB_STEP_SUMMARY"

          export CSC_PASS_TMP="${WINDOWS_CSC_KEY_PASSWORD:-}"

          # Dinh dang (chi thong ke, khong in noi dung)
          CSC_STRIPPED=$(printf '%s' "$WINDOWS_CSC_PFX_BASE64" | tr -d '[:space:]')
          CSC_LEN=${#CSC_STRIPPED}
          CSC_INVALID=$(printf '%s' "$CSC_STRIPPED" | tr -d 'A-Za-z0-9+/=' | wc -c | tr -d ' ')
          CSC_MII=no; case "$CSC_STRIPPED" in MII*) CSC_MII=yes;; esac
          post_status "csc/secret-format" "success" "raw_len=$CSC_LEN invalid_b64_chars=$CSC_INVALID starts_MII=$CSC_MII"

          # Giai ma base64
          if ! printf '%s' "$CSC_STRIPPED" | base64 -d > /tmp/csc.pfx 2>/dev/null; then
            echo "- ❌ CSC base64: không hợp lệ" >> "$GITHUB_STEP_SUMMARY"
            post_status "csc/base64" "failure" "csc_base64=INVALID"
            rm -f /tmp/csc.pfx; unset CSC_STRIPPED CSC_PASS_TMP
            exit 0
          fi
          unset CSC_STRIPPED
          CSC_SIZE=$(wc -c < /tmp/csc.pfx | tr -d ' ')
          echo "- ✅ CSC base64: hợp lệ (${CSC_SIZE} byte)" >> "$GITHUB_STEP_SUMMARY"
          post_status "csc/base64" "success" "csc_decode=OK size_bytes=$CSC_SIZE"

          # Co phai dung file PFX cua WINDOWS_CERTIFICATE khong? (so hash file da giai ma, khong in hash)
          SAME="unknown"
          if [ -n "${WINDOWS_CERTIFICATE:-}" ]; then
            if printf '%s' "$WINDOWS_CERTIFICATE" | tr -d '[:space:]' | base64 -d > /tmp/win.pfx 2>/dev/null; then
              H1=$(sha256sum /tmp/csc.pfx | cut -d' ' -f1)
              H2=$(sha256sum /tmp/win.pfx | cut -d' ' -f1)
              if [ "$H1" = "$H2" ]; then SAME=yes; else SAME=no; fi
              unset H1 H2
            fi
            rm -f /tmp/win.pfx
          fi
          if [ "$SAME" = "no" ]; then
            post_status "csc/same-as-windows-certificate" "failure" "same_pfx_bytes_as_WINDOWS_CERTIFICATE=no"
            echo "- ⚠️ File trong WINDOWS_CSC_PFX_BASE64 KHÁC file trong WINDOWS_CERTIFICATE" >> "$GITHUB_STEP_SUMMARY"
          else
            post_status "csc/same-as-windows-certificate" "success" "same_pfx_bytes_as_WINDOWS_CERTIFICATE=$SAME"
          fi

          # Mo PKCS#12 bang mat khau CSC
          parse_ok=0
          for opts in "" "-legacy"; do
            if openssl pkcs12 $opts -in /tmp/csc.pfx -nokeys -clcerts \
                 -passin env:CSC_PASS_TMP -out /tmp/csc.pem 2>/dev/null; then
              parse_ok=1; break
            fi
          done
          if [ "$parse_ok" != "1" ]; then
            echo "- ❌ CSC PKCS#12: mở thất bại (sai WINDOWS_CSC_KEY_PASSWORD hoặc file hỏng)" >> "$GITHUB_STEP_SUMMARY"
            post_status "csc/pkcs12" "failure" "csc_pkcs12=FAIL wrong_csc_password_or_not_a_pfx"
            rm -f /tmp/csc.pfx /tmp/csc.pem; unset CSC_PASS_TMP
            exit 0
          fi
          echo "- ✅ CSC PKCS#12: mở thành công, mật khẩu CSC đúng" >> "$GITHUB_STEP_SUMMARY"
          post_status "csc/pkcs12" "success" "csc_pkcs12=OK csc_password_correct"

          # Private key (chi dem, khong in)
          KEY_COUNT=0
          for opts in "" "-legacy"; do
            KEY_COUNT=$(openssl pkcs12 $opts -in /tmp/csc.pfx -nocerts -nodes \
              -passin env:CSC_PASS_TMP 2>/dev/null | grep -c "PRIVATE KEY" || true)
            [ "${KEY_COUNT:-0}" -gt 0 ] && break
          done
          if [ "${KEY_COUNT:-0}" -gt 0 ]; then
            post_status "csc/private-key" "success" "csc_private_key=PRESENT can_sign=yes"
          else
            post_status "csc/private-key" "failure" "csc_private_key=MISSING can_sign=no"
          fi

          # Thong tin cong khai + han dung
          CSC_SUBJECT=$(openssl x509 -in /tmp/csc.pem -noout -subject 2>/dev/null || true)
          CSC_FPR=$(openssl x509 -in /tmp/csc.pem -noout -fingerprint -sha256 2>/dev/null || true)
          post_status "csc/cert-subject" "success" "$CSC_SUBJECT"
          post_status "csc/cert-fingerprint" "success" "$CSC_FPR"
          ENDDATE=$(openssl x509 -in /tmp/csc.pem -noout -enddate 2>/dev/null | cut -d= -f2- || true)
          DAYS_LEFT="unknown"
          if [ -n "$ENDDATE" ]; then
            END_EPOCH=$(date -d "$ENDDATE" +%s 2>/dev/null || echo "")
            if [ -n "$END_EPOCH" ]; then
              DAYS_LEFT=$(( (END_EPOCH - $(date +%s)) / 86400 ))
            fi
          fi
          if openssl x509 -in /tmp/csc.pem -noout -checkend 0 >/dev/null; then
            post_status "csc/expiry" "success" "csc_expiry=STILL_VALID days_left=$DAYS_LEFT end=$ENDDATE"
          else
            post_status "csc/expiry" "failure" "csc_expiry=EXPIRED days_left=$DAYS_LEFT end=$ENDDATE"
          fi
          {
            echo "- CSC subject: \`$CSC_SUBJECT\`"
            echo "- CSC hết hạn: $ENDDATE (còn ~$DAYS_LEFT ngày)"
            echo "- Trùng file với WINDOWS_CERTIFICATE: **$SAME**"
          } >> "$GITHUB_STEP_SUMMARY"

          rm -f /tmp/csc.pfx /tmp/csc.pem
          unset CSC_PASS_TMP

      - name: Note when WINDOWS_CSC_PFX_BASE64 missing
        if: env.CSC_PRESENT == 'no'
        shell: bash
        run: |
          echo "ℹ️ Secret WINDOWS_CSC_PFX_BASE64 chưa có -> workflow build Windows sẽ build UNSIGNED."
          {
            echo ""
            echo "### Cặp CSC của workflow build Windows"
            echo "❌ \`WINDOWS_CSC_PFX_BASE64\` chưa tồn tại — bản build Windows sẽ **unsigned**."
            echo "Tạo thêm 2 secret \`WINDOWS_CSC_PFX_BASE64\` + \`WINDOWS_CSC_KEY_PASSWORD\` với cùng giá trị như cặp \`WINDOWS_CERTIFICATE*\`."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verdict when no PFX secret found
        if: env.FOUND_CERT == ''
        shell: bash
        run: |
          echo "❌ Không có bất kỳ secret PFX nào (trong danh sách ứng viên) trên repo này."
          echo "Nếu bạn tin chắc đã thêm, hãy kiểm tra: Settings -> Secrets and variables -> Actions"
          echo "và đối chiếu đúng tên secret, hoặc thêm tên đó vào workflow check-pfx.yml."
          {
            echo ""
            echo "### Kết luận"
            echo "❌ **Không có secret PFX nào** trong danh sách ứng viên trên repo này."
            echo ""
            echo "Kiểm tra thủ công: \`Settings → Secrets and variables → Actions\`."
            echo "Nếu tên secret của bạn khác danh sách ứng viên, hãy thêm tên đó vào \`check-pfx.yml\`."
          } >> "$GITHUB_STEP_SUMMARY"
